<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Groq Web Chatbot</title>

<style>
body {
    background: #04d6ac;
    font-family: Arial, sans-serif;
}

#chat-container {
    width: 400px;
    margin: 50px auto;
    background: white;
    border-radius: 10px;
    box-shadow: 0 0 10px #ccc;
    display: flex;
    flex-direction: column;
}

#header {
    padding: 15px;
    background: #4f46e5;
    color: white;
    font-weight: bold;
    text-align: center;
}

#messages {
    flex: 1;
    padding: 10px;
    overflow-y: auto;
    border-bottom: 1px solid #ddd;
    min-height: 200px;
}

.user {
    text-align: right;
    margin: 5px;
    color: #2563eb;
}

.bot {
    text-align: left;
    margin: 5px;
    color: #111827;
}

#input-area {
    display: flex;
}

input {
    flex: 1;
    padding: 10px;
    border: none;
    outline: none;
}

button {
    padding: 10px 15px;
    border: none;
    background: #4f46e5;
    color: white;
    cursor: pointer;
}

button:disabled {
    background: #9ca3af;
    cursor: not-allowed;
}
</style>
</head>

<body>

<div id="chat-container">
    <div id="header">🤖 Groq AI Chatbot</div>
    <div id="messages"></div>

    <div id="input-area">
        <input id="userInput" placeholder="Type a message..." />
        <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
const BACKEND_URL = "http://localhost:8080/chat";

document.getElementById("userInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
});

async function sendMessage() {
    const input = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const message = input.value.trim();
    if (!message) return;

    input.value = "";
    sendBtn.disabled = true;

    const messagesDiv = document.getElementById("messages");
    messagesDiv.innerHTML += `<div class="user"><b>You:</b> ${escapeHtml(message)}</div>`;
    messagesDiv.scrollTop = messagesDiv.scrollHeight;

    try {
        const response = await fetch(BACKEND_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain" },
            body: message
        });

        const botReply = await response.text();
        messagesDiv.innerHTML += `<div class="bot"><b>Bot:</b> ${escapeHtml(botReply)}</div>`;
    } catch (error) {
        // This fires when the Java server isn't running, the port is blocked,
        // or CORS headers are missing on the backend response.
        messagesDiv.innerHTML += `<div class="bot">⚠️ Could not reach the server at ${BACKEND_URL}. Is GroqChatBot.java running?</div>`;
    } finally {
        sendBtn.disabled = false;
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
}

function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}
</script>

</body>
</html>
